<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Docker Load Balancer</title><style>body{font:16px system-ui;background:#0b1220;color:#e7ecf5;max-width:950px;margin:45px auto;padding:20px}button,input{padding:10px;margin:5px;border-radius:6px}button{cursor:pointer}section{background:#19263b;border-radius:12px;padding:20px;margin:15px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}h1{color:#86c5ff}</style><h1>Docker Load Balancer & MCP Controls</h1><section><h2>Backend status and metrics</h2><pre id="state">Loading...</pre></section><section><h2>Traffic split</h2>A <input id="a" type="number" value="50" min="0" max="100"> B <input id="b" type="number" value="50" min="0" max="100"><button onclick="call('set_split',{a:+a.value,b:+b.value})">Apply</button></section><section><h2>Controls</h2><button onclick="call('start',{backend:'A'})">Start A</button><button onclick="call('start',{backend:'B'})">Start B</button><button onclick="call('stop',{backend:'A'})">Stop A</button><button onclick="call('stop',{backend:'B'})">Stop B</button><button onclick="call('rollout',{backend:'A'})">Rollout A</button><button onclick="call('rollout',{backend:'B'})">Rollout B</button></section><section><h2>Traffic generator</h2>RPM <input id="rpm" type="number" value="0"><button onclick="call('set_rpm',{rpm:+rpm.value})">Set RPM</button></section><section><h2>Events</h2><pre id="events"></pre></section><script>async function refresh(){try{let x=await(await fetch('/api/status')).json();document.getElementById('state').textContent=JSON.stringify({split:x.split,backends:x.backends,counts:x.counts,rpm:x.rpm,rolling:x.rolling},null,2);document.getElementById('events').textContent=x.events.map(e=>e.time+' ['+e.source+'] '+e.message).join('\n')}catch(e){document.getElementById('state').textContent=e.message}}async function call(name,data){let r=await fetch('/api/'+name,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)}),x=await r.json();if(!r.ok)alert(x.error);refresh()}refresh();setInterval(refresh,2000)</script></html>
