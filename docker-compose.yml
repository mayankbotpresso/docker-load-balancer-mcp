name: ab-demo

services:
  container-a:
    build: .
    image: ab-demo
    environment:
      CONTAINER_NAME: A
    ports:
      - "3001:3000"
    stop_grace_period: 30s

  container-b:
    build: .
    image: ab-demo
    environment:
      CONTAINER_NAME: B
    ports:
      - "3002:3000"
    stop_grace_period: 30s
